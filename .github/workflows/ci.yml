name: CI

on:
  push:
    branches: [main, "impl/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - run: cargo clippy --workspace --all-targets

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      # The dylib variant runs on the platform's own SQLite build, whose parser stack is
      # limited (YYSTACKDEPTH=100): generated SQL must stay shallow enough for it (and D1).
      - if: runner.os == 'macOS'
        run: echo "OXILITE_SQLITE_LIBRARY=/usr/lib/libsqlite3.dylib" >> "$GITHUB_ENV"
      - run: cargo test --workspace
      - if: runner.os == 'Linux'
        run: cargo run -p oxilite-compat --bin compat-report

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p oxilite-core --target wasm32-unknown-unknown
      - run: cargo check -p oxilite-jsonld -p oxilite-vc --target wasm32-unknown-unknown

  # The JavaScript packages (@oxilite/node with Oxigraph's JS store tests, @oxilite/d1 on
  # Miniflare D1), both example Workers, and the compatibility harness against D1.
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: cargo install worker-build --locked
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - run: npm run build:wasm -w @oxilite/d1
      - run: npm run build:native -w @oxilite/node
      - run: npm run build
      - run: npm test -w @oxilite/node
      - run: npm test -w @oxilite/d1
      - run: npm test -w oxilite-d1-worker-ts
      - name: Verifiable Credentials walkthrough (Node and local D1)
        working-directory: examples/verifiable-credentials
        run: NODE_PATH=../../node_modules node test.mjs
      - name: Example Rust Worker on local D1
        working-directory: examples/d1-worker
        run: worker-build --release && NODE_PATH=../../node_modules node test.mjs
      - name: Compatibility harness on D1
        run: |
          (cd testsuite/d1-sidecar && PORT=8799 node server.mjs &) 
          sleep 3
          OXILITE_D1_URL=http://127.0.0.1:8799 cargo test -p oxilite-compat
          OXILITE_D1_URL=http://127.0.0.1:8799 cargo test -p oxilite-jsonld -p oxilite-vc -- --test-threads=1

  # The Python package: pyoxigraph's own tests (allow-listed divergences are strict xfails),
  # oxilite's extension tests, and a strict type check. Wheels are built by python-wheels.yml.
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - if: runner.os == 'macOS'
        run: echo "OXILITE_SQLITE_LIBRARY=/usr/lib/libsqlite3.dylib" >> "$GITHUB_ENV"
      - name: Build, test and type-check
        working-directory: bindings/python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest mypy
          maturin develop
          python -m pytest            # includes examples/python, the tutorial tour and the README blocks
          mypy --strict python/oxilite

  # The JVM package: builds the JNI native library for the host platform, then runs the Java
  # test suite (JUnit) against it. Java, Kotlin, Scala and Clojure share this one artifact.
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - working-directory: bindings/jvm
        run: |
          ./scripts/build-native.sh
          cd java && mvn -B test

  lat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g lat.md @fission-ai/openspec@1.9.0
      - run: lat check
      - run: openspec validate --all --strict
