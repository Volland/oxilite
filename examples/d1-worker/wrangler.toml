name = "oxilite-sparql"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"

[build]
command = "cargo install -q worker-build && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "oxilite"
database_id = "00000000-0000-0000-0000-000000000000" # replace with `wrangler d1 create oxilite`
migrations_dir = "migrations"
