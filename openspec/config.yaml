schema: spec-driven

context: |
  oxilite: Oxigraph-compatible RDF/SPARQL database in Rust on SQLite (native, dlopen'ed libsqlite3, Cloudflare D1).
  Sans-IO core; Oxigraph 0.5 crate family (oxrdf, spargebra, spareval, sparesults) with rdf-12/sparql-12; rudof for validation; reasonable for OWL 2 RL.
  Architecture and decisions live in lat.md/ (run `lat check`). Compatibility with Oxigraph is verified by the oxigraph-compat-harness change.

