<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">oxilite</title>
  <!-- Database tile (SQLite-style rounded square) -->
  <rect x="8" y="8" width="216" height="216" rx="44" fill="#0A0A0A"/>

  <!-- Quill drawn as an RDF graph: spine + barbs are nodes and edges -->
  <g transform="translate(-18 -4)" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke="#FFFFFF" stroke-width="5">
      <!-- outline -->
      <path d="M64 192 L88 116 L118 74 L162 54 L204 50 L202 94 L182 138 L140 168 Z" stroke-opacity="0.35"/>
      <!-- spine -->
      <path d="M52 204 L64 192 L100 156 L136 120 L172 84 L204 50"/>
      <!-- barbs -->
      <path d="M100 156 L88 116 M136 120 L118 74 M172 84 L162 54 M100 156 L140 168 M136 120 L182 138 M172 84 L202 94"/>
    </g>
    <!-- spine nodes -->
    <g fill="#FFFFFF">
      <circle cx="64" cy="192" r="7"/>
      <circle cx="100" cy="156" r="8"/>
      <circle cx="136" cy="120" r="8"/>
      <circle cx="172" cy="84" r="8"/>
    </g>
    <!-- barb nodes -->
    <g fill="#FF6B1A">
      <circle cx="88" cy="116" r="10"/>
      <circle cx="118" cy="74" r="10"/>
      <circle cx="162" cy="54" r="9"/>
      <circle cx="140" cy="168" r="10"/>
      <circle cx="182" cy="138" r="10"/>
      <circle cx="202" cy="94" r="9"/>
      <circle cx="204" cy="50" r="12"/>
    </g>
  </g>

  <!-- Edge worker: small cloud with a code glyph, breaking out of the corner -->
  <g fill="#FFFFFF">
    <circle cx="196" cy="200" r="31"/>
    <circle cx="223" cy="210" r="23"/>
    <circle cx="176" cy="214" r="21"/>
    <rect x="160" y="199" width="84" height="40" rx="20"/>
  </g>
  <g fill="#FF6B1A">
    <circle cx="196" cy="200" r="24"/>
    <circle cx="223" cy="210" r="16"/>
    <circle cx="176" cy="214" r="14"/>
    <rect x="167" y="206" width="70" height="26" rx="13"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 203 L181 212 L190 221"/>
    <path d="M212 203 L221 212 L212 221"/>
    <path d="M204 200 L198 224"/>
  </g>
</svg>
