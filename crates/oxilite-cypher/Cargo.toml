[package]
name = "oxilite-cypher"
description = "openCypher over oxilite: property graphs as an RDF 1.2 view, compiled to SQL (native and Cloudflare D1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
oxilite-core.workspace = true
oxrdf.workspace = true
spargebra.workspace = true
serde_json = "1"
thiserror.workspace = true
regex-lite = "0.1"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo"] }

[features]
default = ["tzdb-bundle"]
# Embed the IANA time zone database (needed for named zones on WebAssembly; native builds
# otherwise read /usr/share/zoneinfo).
tzdb-bundle = ["jiff/tzdb-bundle-always"]

[dev-dependencies]
oxilite = { path = "../oxilite", features = ["rusqlite", "dylib", "cypher"] }
oxrdfio.workspace = true
futures = { version = "0.3", default-features = false, features = ["executor"] }
oxilite-core = { workspace = true, features = ["serde"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
