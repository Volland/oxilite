[package]
name = "oxilite-wasm"
description = "WebAssembly build of the oxilite sans-IO core, driven from JavaScript (Cloudflare D1, browsers, Node)"
version.workspace = true
edition.workspace = true
license.workspace = true

repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["cypher", "vc"]
# JSON-LD documents (verbatim storage, one named graph per document); ~0.7 MB.
jsonld = ["dep:oxilite-jsonld"]
# Verifiable Credentials on top of `jsonld` (ssi-vc, bundled W3C contexts); ~0.9 MB more.
vc = ["jsonld", "dep:oxilite-vc"]
# openCypher over the property-graph view, with the IANA time zone database for named zones.
cypher = ["cypher-lite", "oxilite-cypher/tzdb-bundle"]
# The Cypher frontend without the time zone database (named zones are errors; ~0.3 MB smaller).
cypher-lite = ["dep:oxilite-cypher"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxilite-core = { workspace = true, features = ["serde"] }
oxilite-cypher = { workspace = true, optional = true }
oxilite-jsonld = { workspace = true, optional = true, features = ["json"] }
oxilite-vc = { workspace = true, optional = true }
oxrdf.workspace = true
oxrdfio.workspace = true
spargebra.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
