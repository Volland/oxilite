[package]
name = "oxilite"
description = "Oxigraph-compatible RDF database and SPARQL engine on SQLite (native, dlopen'ed libsqlite3, Cloudflare D1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

homepage.workspace = true
documentation = "https://docs.rs/oxilite"
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = ["rusqlite"]
rusqlite = ["dep:oxilite-rusqlite"]
dylib = ["dep:oxilite-dylib"]
d1 = ["dep:oxilite-d1"]
# OWL 2 RL materialization with the `reasonable` reasoner (native, in memory).
reasonable = ["dep:oxilite-reason"]
# openCypher over the property-graph view of the dataset.
cypher = ["dep:oxilite-cypher"]
# Datalog over the same data: recursive rules with stratified negation.
datalog = ["dep:oxilite-datalog"]
# JSON forms of Datalog options and results (JavaScript bindings).
datalog-json = ["datalog", "oxilite-datalog/json"]
# JSON-LD documents: verbatim storage, one named graph per document.
jsonld = ["dep:oxilite-jsonld"]
# Verifiable Credentials on top of `jsonld` (pulls in the `ssi` crates).
vc = ["jsonld", "dep:oxilite-vc"]
# Fetch unknown JSON-LD contexts over HTTP when a handle opts in (native only).
jsonld-network = ["jsonld", "oxilite-jsonld/network"]
# JSON forms of JSON-LD options and results (JavaScript bindings).
jsonld-json = ["jsonld", "oxilite-jsonld/json"]

[dependencies]
oxilite-core.workspace = true
oxilite-rusqlite = { workspace = true, optional = true }
oxilite-dylib = { workspace = true, optional = true }
oxilite-d1 = { workspace = true, optional = true }
oxilite-reason = { workspace = true, optional = true }
oxilite-cypher = { workspace = true, optional = true }
oxilite-datalog = { workspace = true, optional = true }
oxilite-jsonld = { workspace = true, optional = true }
oxilite-vc = { workspace = true, optional = true }
oxrdf.workspace = true
oxrdfio.workspace = true
spargebra.workspace = true
spareval.workspace = true
sparesults.workspace = true
oxiri.workspace = true

[dev-dependencies]
oxilite = { path = ".", features = ["rusqlite", "dylib"] }
