[package]
name = "oxilite-cli"
description = "oxilite command line: load, query, and a SPARQL HTTP endpoint compatible with `oxigraph serve`"
version.workspace = true
edition.workspace = true
license.workspace = true

repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxilite-cli"
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxilite"
path = "src/main.rs"

[dependencies]
oxilite = { workspace = true, features = ["rusqlite", "dylib", "datalog", "cypher"] }
oxilite-core = { workspace = true, features = ["serde"] }
oxilite-validate = { path = "../oxilite-validate", version = "0.5.0" }
oxrdf.workspace = true
oxiri.workspace = true
regex.workspace = true
oxrdfio.workspace = true
spargebra.workspace = true
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
form_urlencoded = "1"
futures = { version = "0.3", default-features = false, features = ["executor"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2.workspace = true
lsp-server = "0.7"
lsp-types = "0.97"
url = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
globset = "0.4"
crossbeam-channel = "0.5"
rudof_rdf = "0.3.21"
rustyline = "18"
unicode-width = "0.2"
terminal_size = "0.4"
