[package]
name = "oxilite-cli"
description = "oxilite command line: load, query, and a SPARQL HTTP endpoint compatible with `oxigraph serve`"
version.workspace = true
edition.workspace = true
license.workspace = true

repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxilite-cli"
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxilite"
path = "src/main.rs"

[dependencies]
oxilite = { workspace = true, features = ["rusqlite", "dylib", "datalog"] }
oxilite-core = { workspace = true, features = ["serde"] }
oxrdf.workspace = true
oxrdfio.workspace = true
spargebra.workspace = true
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
form_urlencoded = "1"
futures = { version = "0.3", default-features = false, features = ["executor"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
