[package]
name = "oxilite-node"
description = "Node.js bindings for oxilite (napi-rs): an Oxigraph-compatible SPARQL store on SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
oxilite = { workspace = true, features = ["rusqlite", "dylib"] }
oxilite-core = { workspace = true, features = ["serde"] }
oxrdf.workspace = true
oxrdfio.workspace = true
spargebra.workspace = true
serde = "1"
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
