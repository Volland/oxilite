[package]
name = "oxilite-jvm"
description = "JVM bindings for oxilite (JNI): an Oxigraph-compatible SPARQL store on SQLite, usable from Java, Kotlin, Scala and Clojure"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
oxilite = { workspace = true, features = ["rusqlite", "dylib", "reasonable", "cypher", "datalog", "datalog-json", "synalog", "synalog-json", "vc", "jsonld-json", "jsonld-network"] }
oxilite-core = { workspace = true, features = ["serde"] }
oxrdf.workspace = true
oxrdfio.workspace = true
spargebra.workspace = true
serde = "1"
serde_json = "1"
jni.workspace = true
